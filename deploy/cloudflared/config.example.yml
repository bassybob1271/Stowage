# Copy to config.yml (gitignored) after `cloudflared tunnel create stowage`,
# replacing <TUNNEL-ID> with the ID it printed.
tunnel: <TUNNEL-ID>
credentials-file: /home/nonroot/.cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: files.example.com
    service: http://app:8787
    originRequest:
      # Keep the public Host header so the app's Origin check matches.
      httpHostHeader: files.example.com
  - service: http_status:404
