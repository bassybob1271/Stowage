# Mounts for docker-compose. Values support ${ENV_VAR} and ${ENV_VAR:-default}.
# Every mount appears as a top-level folder in the browser. More examples: mounts.example.yaml.
mounts:
  - id: s3-main
    label: S3
    kind: s3
    config:
      endpoint: http://minio:9000
      bucket: stowage
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}
      forcePathStyle: true
      createBucket: true

  - id: ipfs
    label: IPFS
    kind: ipfs
    config:
      apiUrl: http://kubo:5001
      gatewayUrl: http://kubo:8080
      mfsRoot: /stowage

  - id: local
    label: Local disk
    kind: local
    config:
      root: /data/files
