# Stowage: app + S3 dev target + IPFS node (+ optional rclone and Caddy TLS).
#
#   cp deploy/.env.example deploy/.env    # then edit secrets
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://localhost:8787
#
# Optional profiles:  --profile rclone   --profile tls
name: stowage

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stowage:latest
    env_file: .env
    environment:
      # Plain HTTP on localhost for the quickstart. Behind Caddy (tls profile) set COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["${APP_BIND:-127.0.0.1}:8787:8787"]
    volumes:
      - stowage-data:/data
      - ./mounts.yaml:/config/mounts.yaml:ro
    depends_on:
      minio: { condition: service_started }
      kubo: { condition: service_healthy }
    restart: unless-stopped

  # S3 dev target. MinIO stopped publishing community images in late 2025, so
  # this service runs RustFS, a MinIO-compatible S3 server (Apache-2.0). The
  # service keeps the name "minio" so S3 endpoints in docs/configs stay the same.
  # The bucket is auto-created by the app (S3 mount option createBucket: true).
  minio:
    image: rustfs/rustfs:1.0.6
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-stowage}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change-me-s3-secret}
    volumes: [s3-data:/data]
    # Not published: only the app talks to it. Uncomment to reach it from the host.
    # ports: ["127.0.0.1:9000:9000"]
    restart: unless-stopped

  # IPFS node. The RPC API (5001) is NOT published — it is admin-level access.
  kubo:
    image: ipfs/kubo:v0.43.1
    environment:
      IPFS_PROFILE: server
    volumes: [ipfs-data:/data/ipfs]
    ports:
      - "4001:4001/tcp"   # swarm (peer-to-peer); safe to publish
      - "4001:4001/udp"
    restart: unless-stopped

  # Optional: catch-all backend via rclone (Google Drive, OneDrive, Dropbox, ...).
  # Configure remotes in ./rclone/rclone.conf, then set RCLONE_REMOTE.
  rclone:
    profiles: [rclone]
    image: rclone/rclone:1.76.0
    command: serve webdav ${RCLONE_REMOTE:-local:/data} --addr :8080 --rc --rc-addr :5572 --rc-no-auth --vfs-cache-mode writes
    volumes:
      - ./rclone:/config/rclone
      - rclone-data:/data
    restart: unless-stopped

  # Optional: automatic TLS. Set DOMAIN in .env and point DNS at this host.
  caddy:
    profiles: [tls]
    image: caddy:2.10-alpine
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8787
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy-data:/data]
    depends_on: [app]
    restart: unless-stopped

  # Cloudflare Tunnel runs natively (not in Docker) so one connector can serve
  # both files.* (this app, 127.0.0.1:8787) and live.* (apps/live). See
  # apps/live/scripts/run-native.sh and README → "Cloudflare Tunnel".

volumes:
  stowage-data:
  s3-data:
  ipfs-data:
  rclone-data:
  caddy-data:
