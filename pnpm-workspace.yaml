packages:
  - apps/*
  - packages/*
  - e2e

# Native/postinstall builds we allow. cpu-features is an optional ssh2 speedup
# that needs a compiler; skipping it is harmless.
allowBuilds:
  better-sqlite3: true
  sharp: true
  esbuild: true
  ssh2: true
  "@node-rs/argon2": true
  cpu-features: false
